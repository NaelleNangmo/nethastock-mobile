name: nethastock_frontend
description: "NethaStock – Application mobile de gestion de stock multi-sites"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.7.0

  # Stockage sécurisé (tokens JWT, préférences)
  flutter_secure_storage: ^9.2.2

  # Gestion d'état
  provider: ^6.1.2

  # Navigation déclarative
  go_router: ^14.6.2

  # Scanner QR / Barcode
  mobile_scanner: ^5.2.3

  # Images réseau avec cache
  cached_network_image: ^3.4.1

  # Sélecteur d'image (upload photo produit)
  image_picker: ^1.1.2

  # Internationalisation (dates, nombres)
  intl: ^0.19.0

  # Égalité structurelle pour les modèles
  equatable: ^2.0.5

  # Icônes
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500

  assets:
    - assets/fonts/
    - assets/images/
